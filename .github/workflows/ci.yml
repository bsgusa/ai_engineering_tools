name: CI

on:
  push:
    branches: [main, feature/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for exposed secrets
        run: |
          # Same boundary rule as the other bsgusa repos: length AND boundary,
          # so prose never trips it. The .env-shaped keys this toolkit reads
          # (BLOFIN_*, SUPABASE_*, ghp_) are exactly what must not land in git.
          if grep -rE '(^|[^A-Za-z0-9])(sbp_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|BLOFIN_API_[A-Za-z0-9_-]{20,})' \
               --include='*.py' --include='*.md' --include='*.yaml' --include='*.yml' \
               --include='*.json' --include='*.jsonl' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=state . ; then
            echo "::error::Potential secret detected in repo. Remove before merging."
            exit 1
          fi

      - name: Byte-compile every script
        run: python3 -m compileall -q .

      - name: Example config parses
        run: python3 -c "import yaml, sys; yaml.safe_load(open('config.example.yaml')); print('config.example.yaml OK')" 2>/dev/null || echo "pyyaml not needed for compile check — skipping"
