# ai-improve — weekly LLM code-improvement pass + on-demand feature builds.
# Generated by ai_engineering_tools/code_sweep (control plane) — edit the engine, not this file.
#
#   schedule / dispatch without brief → FINDINGS ONLY (ranked issues + upstream
#                                      pattern opportunities → one rolling issue)
#   dispatch WITH a brief            → the model may rewrite allowlisted files;
#                                      every change is validated (install + checks)
#                                      before a DRAFT PR is opened. Never auto-merges.
#
# Gates: repo Actions variable AI_IMPROVE_ENABLED=true AND secret AI_GATEWAY_API_KEY.
# Budget: one gateway call, output-token cap, byte-budgeted context (engine config).
name: ai-improve

on:
  schedule:
    - cron: "AI_CRON"
  workflow_dispatch:
    inputs:
      brief:
        description: "Feature/improvement brief — leave empty for a findings-only scan"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-improve-${{ github.repository }}
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      AI_IMPROVE_ENABLED: ${{ vars.AI_IMPROVE_ENABLED }}
      AI_IMPROVE_MODEL: ${{ vars.AI_IMPROVE_MODEL }}
      BRIEF: ${{ inputs.brief || '' }}
      SWEEP_OUT: ${{ runner.temp }}/sweep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout sweep engine (control plane, public repo)
        uses: actions/checkout@v4
        with:
          repository: bsgusa/ai_engineering_tools
          ref: code-sweep-v1
          path: ${{ runner.temp }}/engine
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Gate + run AI pass
        id: ai
        continue-on-error: true # business failures (no key, provider error) are reported, not red
        run: |
          set -uo pipefail
          mkdir -p "$SWEEP_OUT"
          if [ "$AI_IMPROVE_ENABLED" != "true" ]; then
            echo "Skipped: AI_IMPROVE_ENABLED is not 'true' for this repo (Actions → Variables)." >> "$GITHUB_STEP_SUMMARY"
            echo "status=disabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "Skipped: secret AI_GATEWAY_API_KEY not set for this repo." >> "$GITHUB_STEP_SUMMARY"
            echo "status=no_key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$BRIEF" ]; then
            node "$RUNNER_TEMP/engine/code_sweep/scripts/ai-improve.mjs" --brief "$BRIEF"
          else
            node "$RUNNER_TEMP/engine/code_sweep/scripts/ai-improve.mjs"
          fi

      - name: Revert unvalidated model changes
        if: steps.ai.outputs.changed != '1'
        run: |
          # scan mode and rejected builds must leave the tree exactly as it was
          git checkout -- . 2>/dev/null || true
          git clean -fd -e node_modules 2>/dev/null || true
          git status --porcelain || true

      - name: Open validated draft PR
        if: steps.ai.outputs.changed == '1'
        run: |
          set -uo pipefail
          slug=$(printf '%s' "$BRIEF" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-32)
          [ -z "$slug" ] && slug="brief"
          branch="ai/${slug}-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "Branch $branch exists — skipping duplicate PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "draft(ai): ${BRIEF:0:72}" -m "Scheduled agent run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "$branch"
          gh pr create --draft \
            --title "draft(ai): ${BRIEF:0:72}" \
            --body-file "$SWEEP_OUT/pr-body.md" \
            || echo "::warning::PR could not be created (permissions?)"

      - name: Publish findings — summary + rolling issue
        if: always()
        run: |
          set -uo pipefail
          F="$SWEEP_OUT/ai-findings.md"
          STATUS="$(cat "$SWEEP_OUT/status.txt" 2>/dev/null || echo "${{ steps.ai.outputs.status }}")"
          {
            echo "## ai-improve — ${{ github.repository }}"
            echo
            echo "- **Status:** $STATUS"
            echo "- **Mode:** $([ -n "$BRIEF" ] && echo "build (brief)" || echo "scan (findings only)")"
            echo "- **Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            [ -f "$F" ] && cat "$F" || echo "_No findings file — see the Gate + run step._"
          } >> "$GITHUB_STEP_SUMMARY"

          # Findings become one rolling issue the owner can triage. Only for
          # statuses that actually contain findings — not for disabled/no_key noise.
          case "$STATUS" in
            findings*|no_changes*|rejected_*)
              gh label create automated:ai \
                --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
                --description "AI improvement findings — human triages" --force 2>/dev/null || true
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label automated:ai \
                --state open --json number --jq '.[0].number' 2>/dev/null || true)
              body_file="$SWEEP_OUT/issue.md"
              { echo "> ai-improve rolling findings — $(date -u '+%Y-%m-%d %H:%M UTC'), run attached at the bottom."; echo; cat "$F"; echo; echo "**Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > "$body_file"
              if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file" \
                  || echo "::warning::could not comment on rolling issue"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --label automated:ai \
                  --title "ai-improve: improvement findings" --body-file "$body_file" \
                  || echo "::warning::could not create issue (issues disabled?) — see run summary"
              fi
              ;;
            *) echo "Status '$STATUS' — no issue opened." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Fail loudly on degraded runs
        if: always()
        run: |
          # engine philosophy: a silent failure is the failure mode we exist to
          # remove. Provider/key problems surface as a red job → GitHub notification.
          STATUS="$(cat "$SWEEP_OUT/status.txt" 2>/dev/null || echo missing)"
          if [ "$STATUS" = "missing" ] && [ "${{ steps.ai.outcome }}" = "failure" ]; then
            echo "AI step failed and wrote no status — engine crash."
            exit 1
          fi
          case "$STATUS" in
            api_error*|engine_error*)
              echo "Degraded: $STATUS"
              exit 1
              ;;
            *) echo "OK: $STATUS" ;;
          esac
