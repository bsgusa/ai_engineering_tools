# staff-sweep — nightly deterministic code sweep (lint / typecheck / tests / audit).
# Generated by ai_engineering_tools/code_sweep (control plane) — edit the engine, not this file.
# Model: findings land in the run summary + one rolling issue; safe dependency fixes
# are offered as a DRAFT PR. This workflow never pushes to the default branch and
# never merges anything. The owner merges.
name: staff-sweep

on:
  schedule:
    - cron: "SWEEP_CRON" # staggered per repo at rollout to be polite to the runners
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: staff-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout sweep engine (control plane, public repo)
        uses: actions/checkout@v4
        with:
          repository: bsgusa/ai_engineering_tools
          ref: code-sweep-v1
          path: ${{ runner.temp }}/engine
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run blocking checks (lint / typecheck / test / claims)
        id: checks
        continue-on-error: true # the report step below always runs
        run: bash "$RUNNER_TEMP/engine/code_sweep/scripts/sweep.sh"
        env:
          SWEEP_OUT: ${{ runner.temp }}/sweep

      - name: Attempt dependency audit fix (only when baseline is green)
        id: fix
        if: steps.checks.outcome == 'success'
        run: |
          set -uo pipefail
          npm audit fix --omit=dev > "$RUNNER_TEMP/sweep/auditfix.log" 2>&1 || true
          if git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Nothing to fix automatically." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # the fix must survive the full check suite before anyone is asked to merge it
          if bash "$RUNNER_TEMP/engine/code_sweep/scripts/sweep.sh"; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "Audit fix failed validation — reverted." >> "$GITHUB_STEP_SUMMARY"
            git checkout -- .
            git clean -fd -e node_modules || true
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          SWEEP_OUT: ${{ runner.temp }}/sweep

      - name: Report — step summary + rolling issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SUMMARY="$RUNNER_TEMP/sweep/summary.md"
          {
            echo "## staff-sweep — ${{ github.repository }}"
            echo
            [ -f "$SUMMARY" ] && cat "$SUMMARY" || echo "_sweep produced no summary (install failure before report — see run)._"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.checks.outcome }}" != "success" ]; then
            gh label create automated:sweep \
              --repo "$GITHUB_REPOSITORY" --color D93F0B \
              --description "Automated sweep findings — human triages" --force 2>/dev/null || true
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label automated:sweep \
              --state open --json number --jq '.[0].number' 2>/dev/null || true)
            body_file="$RUNNER_TEMP/sweep/issue.md"
            { echo "> Automated staff-sweep failure — newest run first. Updated $(date -u '+%Y-%m-%d %H:%M UTC')."; echo; cat "$SUMMARY" 2>/dev/null; } > "$body_file"
            if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file" \
                || echo "::warning::could not comment on rolling issue"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --label automated:sweep \
                --title "staff-sweep: failing checks" --body-file "$body_file" \
                || echo "::warning::could not create issue (issues disabled?) — see run summary"
            fi
          fi

      - name: Open dependency-fix draft PR
        if: steps.fix.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          branch="auto/sweep-audit-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists — leaving the open PR alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Dependency audit fixes — offered by staff-sweep"
            echo
            echo "- \`npm audit fix --omit=dev\` applied; full check suite re-run green (this run)"
            echo "- Checks run: $(tr '\n' ' ' < "$RUNNER_TEMP/sweep/results.txt")"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Opened by a scheduled agent — **it never merges itself**."
            echo "- Note: PRs opened with the default GITHUB_TOKEN do not trigger pull_request workflows; the validation is the run linked above."
          } > "$RUNNER_TEMP/sweep/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "fix(deps): npm audit fix via staff-sweep"
          git push origin "$branch"
          gh pr create --draft \
            --title "fix(deps): dependency audit fixes (staff-sweep)" \
            --body-file "$RUNNER_TEMP/sweep/pr-body.md" \
            || echo "::warning::PR could not be created (permissions?)"
