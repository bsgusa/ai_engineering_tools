# AI Engineering Toolkit configuration
# Copy this file to config.yaml and fill in your values.
# Never commit config.yaml (it may contain keys). It is gitignored.
#
# BEFORE THIS WORKS — two things bit us on 2026-11-07:
#
# 1. pyyaml must be installed. The toolkit is stdlib-only by design, and
#    ai_drafts.py / orchestrator.py both do `except ImportError: yaml = None`.
#    With no pyyaml, config.yaml is NEVER read and the LLM stays disabled
#    with no warning — you get template drafts and no error.
#       python3 -m pip install --user pyyaml
#
# 2. provider/base_url must agree. With provider: ollama the code builds
#       base_url + "/api/chat"
#    so base_url "http://localhost:11434/v1" produces ".../v1/api/chat" -> 404
#    -> silent template fallback. Correct pairs, both live-verified 2026-11-07:
#       provider: ollama            base_url: http://localhost:11434   (/api/chat)
#       provider: openai-compatible base_url: http://localhost:11434/v1 (/v1/chat/completions)
#
# The working config.yaml on this machine uses the first pair, model llama3.2.

paths:
  # Your existing repos
  trading_dir: ~/trading
  job_automation_dir: ~/AI-Job-Automation
  n8n_dir: ~/.n8n

  # Toolkit local state
  state_dir: ./state
  reports_dir: ./reports
  ledger_file: ./state/pending.jsonl   # local source of truth for pending items

# LLM (optional — toolkit works without it via template fallback)
llm:
  enabled: false
  provider: openai-compatible   # openai-compatible | ollama | anthropic | none
  # CAUTION (see header): with provider `ollama`, base_url must be
  # http://localhost:11434 (no /v1) or the built URL 404s. The value below is
  # correct ONLY for provider `openai-compatible`.
  base_url: http://localhost:11434/v1   # ollama default (OpenAI-compatible)
  model: nemotron-3.5-super   # OR any model you actually have: `ollama list`
  api_key: ${LLM_API_KEY}       # set in env; never hardcode. Ollama needs none.
  temperature: 0.3
  max_tokens: 600

# Supabase (optional — sync pending items to Supabase; never blocks local runs)
supabase:
  enabled: false
  url: ${SUPABASE_URL}
  service_key: ${SUPABASE_SERVICE_KEY}
  table: pending_items

# Trading integration (matches your existing executor.py lock)
trading:
  ledger_file: ~/trading/ledger.jsonl
  env_file: ~/trading/.env
  risk_caps:
    risk_per_trade_pct: 1
    max_leverage: 5
    max_book_x: 2
    daily_halt_pct: 3
    drawdown_halt_pct: 10
  # Live trading stays locked unless you set these in your .env:
  #   TRADING_MODE=live
  #   TRADING_CONFIRM=I_UNDERSTAND_REAL_MONEY

# Sources to scan (add your own by extending orchestrator.py)
sources:
  trading_ledger: true
  trading_reports: true
  blofin_account: true
  job_automation: true
  inbox_files: false      # point at a folder of .txt/.md files if you want
  inbox_path: ~/notes

# Scoring weights (1–5 each)
scoring:
  impact_default: 3
  urgency_default: 3
  effort_default: 3

# Safety
safety:
  dry_run_by_default: true
  require_execute_flag: true
  max_auto_actions_per_run: 0   # 0 = never auto-execute; always ask
